[workspace]

# Virtual workspaces don't inherit a resolver from the members' edition, so cargo would
# default to resolver v1 and warn. v2 is what edition 2021 implies, and it matters here:
# v1 unifies features across build-/dev-dependencies and across platform-specific deps,
# so features from a target we aren't building (core is split cfg(windows)/cfg(unix))
# could leak into the normal dependency graph.
resolver = "2"

members = [
    "core",
    "Flying Carpet/src-tauri",
]

# Dependencies get full optimization even in dev builds: snow's ChaCha20-Poly1305 runs
# ~20x slower at opt-level 0 — slow enough that a dev-build sender bottlenecks a transfer
# below the network and looks like a wire problem (it cost a full day of misdirected
# investigation; see FlyingCarpetApple/docs/apple-receive-throughput.md). App code in
# this workspace stays at opt-level 0 and remains debuggable.
[profile.dev.package."*"]
opt-level = 3
